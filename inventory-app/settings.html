<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · Smart Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <div class="content">

      <div class="page-head">
        <div>
          <h2>Settings</h2>
          <div class="desc">Store details, currency, tax rate, and your data.</div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>Store information</h3></div>
          <form id="settings-form">
            <div class="field">
              <label>Store name</label>
              <input type="text" id="s-store-name">
            </div>
            <div class="field-row">
              <div class="field">
                <label>Currency</label>
                <select id="s-currency">
                  <option value="USD">USD — US Dollar ($)</option>
                  <option value="EUR">EUR — Euro (€)</option>
                  <option value="GBP">GBP — British Pound (£)</option>
                  <option value="INR">INR — Indian Rupee (₹)</option>
                  <option value="JPY">JPY — Japanese Yen (¥)</option>
                </select>
              </div>
              <div class="field">
                <label>Default tax rate (%)</label>
                <input type="number" id="s-tax-rate" min="0" step="0.1">
              </div>
            </div>
            <div class="field">
              <label style="display:flex; align-items:center; gap:8px; font-weight:500;">
                <input type="checkbox" id="s-sound" style="width:auto;"> Enable real-time audio chimes & notifications
              </label>
            </div>
            <button type="submit" class="btn btn-primary">Save settings</button>
          </form>
        </div>

        <div class="card">
          <div class="card-head"><h3>Backup & restore</h3></div>
          <p class="field-hint">Everything is stored locally in this browser. Export a backup regularly, or move your data to another device.</p>
          <div style="display:flex; gap:10px; flex-wrap:wrap; margin:14px 0;">
            <button class="btn" id="export-backup-btn">Export backup (JSON)</button>
            <button class="btn" id="import-backup-btn">Import backup</button>
            <input type="file" id="import-file" accept="application/json" style="display:none;">
          </div>
          <hr class="divider">
          <p class="field-hint">Danger zone — this clears every product, sale, and contact from this browser.</p>
          <button class="btn btn-danger" id="wipe-btn">Erase all data</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  App.renderShell('settings', 'Settings', 'Preferences');

  function loadSettings() {
    const s = Storage.getSettings();
    Utils.qs('#s-store-name').value = s.storeName || '';
    Utils.qs('#s-currency').value = s.currency || 'USD';
    Utils.qs('#s-tax-rate').value = s.taxRate ?? 0;
    Utils.qs('#s-sound').checked = s.soundEnabled !== false;
  }

  Utils.qs('#settings-form').addEventListener('submit', e => {
    e.preventDefault();
    Storage.saveSettings({
      storeName: Utils.qs('#s-store-name').value.trim() || 'My Store',
      currency: Utils.qs('#s-currency').value,
      taxRate: Number(Utils.qs('#s-tax-rate').value) || 0,
      soundEnabled: Utils.qs('#s-sound').checked
    });
    Utils.playChime('success');
    Utils.toast('Settings saved successfully', 'success');
    App.renderShell('settings', 'Settings', 'Preferences');
  });

  Utils.qs('#export-backup-btn').addEventListener('click', () => {
    Utils.downloadFile('inventory-backup.json', Storage.exportAll(), 'application/json');
  });

  Utils.qs('#import-backup-btn').addEventListener('click', () => Utils.qs('#import-file').click());
  Utils.qs('#import-file').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        Storage.importAll(reader.result);
        Utils.toast('Backup restored — reloading…', 'success');
        setTimeout(() => location.reload(), 900);
      } catch (err) {
        Utils.toast('That file could not be read', 'error');
      }
    };
    reader.readAsText(file);
  });

  Utils.qs('#wipe-btn').addEventListener('click', () => {
    if (!Utils.confirmAction('This will permanently erase all data in this browser. Continue?')) return;
    Storage.wipeAll();
    Utils.toast('All data erased — reloading…', 'success');
    setTimeout(() => location.reload(), 900);
  });

  loadSettings();
</script>
</body>
</html>
