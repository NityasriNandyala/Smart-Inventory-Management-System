<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports · Smart Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <div class="content">

      <div class="page-head">
        <div>
          <h2>Reports</h2>
          <div class="desc">Sales, stock, and profit — export any report as CSV.</div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn is-active" data-tab="sales">Sales report</button>
        <button class="tab-btn" data-tab="stock">Stock report</button>
        <button class="tab-btn" data-tab="profit">Profit report</button>
      </div>

      <div class="tab-panel is-active" id="panel-sales">
        <div class="stat-grid" id="sales-report-summary"></div>
        <div class="page-head"><div></div><button class="btn" id="export-sales-csv">Export CSV</button></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Customer</th><th>Items</th><th>Tax</th><th>Total</th></tr></thead>
            <tbody id="sales-report-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-panel" id="panel-stock">
        <div class="stat-grid" id="stock-report-summary"></div>
        <div class="page-head"><div></div><button class="btn" id="export-stock-csv">Export CSV</button></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Product</th><th>Category</th><th>Stock</th><th>Value</th><th>Status</th></tr></thead>
            <tbody id="stock-report-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-panel" id="panel-profit">
        <div class="stat-grid" id="profit-report-summary"></div>
        <div class="page-head"><div></div><button class="btn" id="export-profit-csv">Export CSV</button></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Product</th><th>Units sold</th><th>Revenue</th><th>Profit</th><th>Margin</th></tr></thead>
            <tbody id="profit-report-tbody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/inventory.js"></script>
<script src="js/reports.js"></script>
<script>
  App.renderShell('reports', 'Reports', 'Insights');
  ReportsPage.init();
</script>
</body>
</html>
